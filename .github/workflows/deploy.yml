name: Deploy AIR (static)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AIR_DEPLOY_HOST }}
          username: ${{ secrets.AIR_DEPLOY_USER }}
          key: ${{ secrets.AIR_DEPLOY_KEY }}
          script: |
            set -e
            cd /var/www/air.noteify.us
            git fetch --all
            git reset --hard origin/main
            sudo nginx -t
            sudo systemctl reload nginx
